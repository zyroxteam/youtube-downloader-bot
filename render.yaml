services:
  - type: web
    name: zyrox-youtube-downloader-bot
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: FORCE_JOIN
        value: "on"
      - key: FORCE_JOIN_CHANNELS
        value: "ZyroxV1,ZyroxMod"
      - key: PORT
        value: "8000"
